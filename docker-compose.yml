version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinic_postgres
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: clinic_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clinic-net
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: clinic_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinic.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    ports:
      - "5050:80"
    networks:
      - clinic-net
    restart: always

  nginx:
    image: nginx:alpine
    container_name: clinic_nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - clinic-net
    restart: always

volumes:
  pgdata:

networks:
  clinic-net:
    driver: bridge